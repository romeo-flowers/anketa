name: Кеш витрины

# Витрина берёт каталог из статического vitrina/data.json (GitHub Pages, CDN ~50 мс) — иначе
# клиент ждал бы 3.7-4.4 сек прямой ответ Apps Script. Этот workflow держит data.json свежим.
#
# ВАЖНО про корректность: страница ТЕПЕРЬ всегда перепроверяет каталог живым запросом после
# отрисовки из статики (см. vitrina/index.html, revalidateVitrina). То есть даже устаревший
# data.json не покажет проданное как доступное — клиент сам подтянет живой список за ~4 сек.
# Поэтому подвисание этого обновления — потеря скорости, НЕ ошибка наличия.
on:
  schedule:
    - cron: '*/10 * * * *'   # GitHub исполняет best-effort: по факту раз в 1-3.5 часа
  workflow_dispatch:         # можно дёрнуть руками из вкладки Actions
  repository_dispatch:       # надёжный источник: триггер Apps Script warmVitrinaCache шлёт
    types: [vitrina-refresh] # событие каждые 5 минут — не зависит от расписания GitHub

permissions:
  contents: write

concurrency:
  group: vitrina-cache
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужна полная история: время коммита data.json — запасная метрика

      # Отметка последнего УСПЕШНОГО забора каталога. Живёт в кеше Actions, а не в репозитории:
      # писать её коммитом значило бы 288 коммитов в сутки.
      - name: Восстановить отметку последнего успешного забора
        uses: actions/cache/restore@v4
        with:
          path: .lastok
          key: vitrina-lastok-${{ github.run_id }}
          restore-keys: vitrina-lastok-

      - name: Забрать каталог из Apps Script
        run: |
          set -e
          # 🔴 Почему НЕ возраст коммита data.json (так было до 05.08.2026 и давало ложные письма).
          # Коммит делается только если каталог ИЗМЕНИЛСЯ. Ночью магазин не работает, букеты те же,
          # коммитов нет — и файл «стареет» до порога, хотя забор каталога всё это время идёт каждые
          # 5 минут. Первый же транзиентный 404 от Apps Script (Google отдаёт его на живом /exec без
          # причины: три одинаковых запроса дали 200, 200, 404) превращался в вердикт «каталог
          # заморожен» и письмо. Реальный случай — запуск 04.08 в 23:45 UTC.
          # Теперь меряем время последнего успешного ЗАБОРА, а не последнего изменения каталога.
          #
          # ⚠️ И это НЕ «время последнего успешного запуска»: тихий выход ниже тоже даёт успешный
          # запуск, так что по нему затяжной сбой маскировал бы сам себя до бесконечности.
          LAST_OK_TS=$(cat .lastok 2>/dev/null || echo "")
          if [ -z "$LAST_OK_TS" ]; then
            # Кеша ещё нет (первый запуск после правки) — падаем на прежнюю метрику.
            LAST_OK_TS=$(git log -1 --format=%ct -- vitrina/data.json || echo 0)
          fi
          export LAST_OK_TS
          python3 - <<'PY'
          import json, os, sys, time, urllib.request

          URL = ("https://script.google.com/macros/s/"
                 "AKfycbx0FYyE3hckyyyhzZPbf4X2gELlhLoGNj8YbRfJcjj1bTbKlKjo-n16cMUWN7SBnxDepw/exec")

          # Три попытки: холодный старт Apps Script / временный сбой Posiflora иногда отдают
          # пусто или HTML вместо каталога (та же причина, по которой в самой витрине стоит ретрай).
          items = None
          for attempt in range(1, 4):
              try:
                  req = urllib.request.Request(
                      URL, data=json.dumps({"type": "vitrina_list"}).encode(),
                      headers={"Content-Type": "text/plain"}, method="POST")
                  with urllib.request.urlopen(req, timeout=120) as r:
                      got = json.loads(r.read().decode())
                  if isinstance(got, list) and got:
                      items = got
                      break
                  print(f"попытка {attempt}: пустой ответ")
              except Exception as e:
                  print(f"попытка {attempt}: {e}")
              time.sleep(5)

          if items:
              with open("vitrina/data.json", "w", encoding="utf-8") as f:
                  json.dump(items, f, ensure_ascii=False, separators=(",", ":"))
              # Отметка живого забора. Пишется ВСЕГДА при успехе, даже если каталог не изменился
              # и коммита не будет — именно в этом весь смысл правки.
              with open(".lastok", "w") as f:
                  f.write(str(int(time.time())))
              print(f"записано букетов: {len(items)}")
              sys.exit(0)

          # Каталог не отдался. Раньше здесь был безусловный sys.exit(1) — но теперь триггер
          # шлёт событие каждые 5 минут, и на любом коротком сбое Posiflora это давало письмо
          # каждые 5 минут. Плюс клиент и так перепроверяет каталог вживую, так что устаревший
          # data.json безопасен. Поэтому шумим ТОЛЬКО если каталог заморожен по-настоящему долго.
          STALE_LIMIT_MIN = 180
          last = int(os.environ.get("LAST_OK_TS") or 0)
          age_min = (time.time() - last) / 60 if last else 1e9
          if age_min < STALE_LIMIT_MIN:
              print(f"Каталог не отдался (транзиент). Последний успешный забор — {age_min:.0f} мин назад, "
                    f"порог {STALE_LIMIT_MIN}. Клиент всё равно перепроверяет вживую. Выходим тихо, без письма.")
              sys.exit(0)
          print(f"Каталог не удаётся забрать уже дольше {STALE_LIMIT_MIN} мин "
                f"(последний успешный забор — {age_min:.0f} мин назад). Похоже на затяжной сбой — "
                f"падаем осознанно, чтобы пришло ОДНО письмо.")
          sys.exit(1)
          PY

      # Сохраняем отметку под ключом этого запуска: ключи в кеше Actions неизменяемы, поэтому
      # каждый раз новый, а restore-keys подтягивает самый свежий по префиксу. Файл ~10 байт.
      - name: Сохранить отметку последнего успешного забора
        if: hashFiles('.lastok') != ''
        uses: actions/cache/save@v4
        with:
          path: .lastok
          key: vitrina-lastok-${{ github.run_id }}

      - name: Закоммитить, если изменилось
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- vitrina/data.json; then
            echo "каталог не изменился"
          else
            git add vitrina/data.json
            git commit -m "chore(vitrina): обновлён кеш каталога"
            git push
          fi
