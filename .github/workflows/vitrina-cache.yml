name: Кеш витрины

# Витрина тянула каталог напрямую из Apps Script — он отвечает 3.7-4.4 сек, и всё это
# время клиент смотрел на лоадер. Здесь каталог раз в 10 минут складывается в статический
# vitrina/data.json: страница берёт его с GitHub Pages (CDN, ~50 мс) и рисуется сразу.
# Свежесть не страдает: у самого Apps Script кеш каталога и так 600 сек.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:        # можно дёрнуть руками из вкладки Actions

permissions:
  contents: write

concurrency:
  group: vitrina-cache
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Забрать каталог из Apps Script
        run: |
          python3 - <<'PY'
          import json, sys, time, urllib.request

          URL = ("https://script.google.com/macros/s/"
                 "AKfycbx0FYyE3hckyyyhzZPbf4X2gELlhLoGNj8YbRfJcjj1bTbKlKjo-n16cMUWN7SBnxDepw/exec")

          # Три попытки: холодный старт Apps Script иногда отдаёт пусто или отваливается
          # (та же причина, по которой в самой витрине стоит ретрай). Если не вышло ни разу —
          # job ПАДАЕТ намеренно: GitHub пришлёт письмо, иначе каталог замрёт незаметно.
          items = None
          for attempt in range(1, 4):
              try:
                  req = urllib.request.Request(
                      URL, data=json.dumps({"type": "vitrina_list"}).encode(),
                      headers={"Content-Type": "text/plain"}, method="POST")
                  with urllib.request.urlopen(req, timeout=120) as r:
                      got = json.loads(r.read().decode())
                  if isinstance(got, list) and got:
                      items = got
                      break
                  print(f"попытка {attempt}: пустой ответ")
              except Exception as e:
                  print(f"попытка {attempt}: {e}")
              time.sleep(5)

          if not items:
              print("Apps Script не отдал каталог с трёх попыток.")
              print("Витрина продолжает работать на прежнем data.json, но он устаревает.")
              sys.exit(1)          # падаем осознанно — чтобы пришло уведомление

          with open("vitrina/data.json", "w", encoding="utf-8") as f:
              json.dump(items, f, ensure_ascii=False, separators=(",", ":"))
          print(f"записано букетов: {len(items)}")
          PY

      - name: Закоммитить, если изменилось
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- vitrina/data.json; then
            echo "каталог не изменился"
          else
            git add vitrina/data.json
            git commit -m "chore(vitrina): обновлён кеш каталога"
            git push
          fi
