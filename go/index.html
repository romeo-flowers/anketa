<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Romeo Flowers — Костанай</title>
<meta name="description" content="Букеты с доставкой по Костанаю. Каталог, заказ в WhatsApp, бонусы.">
<style>
  @font-face{font-family:Circe;src:url(../vitrina/fonts/circe-300.woff2) format('woff2');font-weight:300;font-display:swap}
  @font-face{font-family:Circe;src:url(../vitrina/fonts/circe-400.woff2) format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:Circe;src:url(../vitrina/fonts/circe-700.woff2) format('woff2');font-weight:700;font-display:swap}
  :root{--green:#8ca28c;--green-dark:#7a9079;--cream:#ece7e1;--card:#faf8f5;--ink:#2f3330}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--cream);color:var(--ink);
       font-family:Circe,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-weight:400}
  .wrap{max-width:460px;margin:0 auto;padding:0 20px 40px;min-height:100vh;display:flex;flex-direction:column}
  header{background:var(--green);margin:0 -20px;padding:34px 20px 28px;text-align:center}
  header img{width:132px;height:auto;display:block;margin:0 auto}
  .tag{margin:26px 0 22px;text-align:center;font-size:15px;line-height:1.5;color:#5c635c}
  a.btn{display:block;background:var(--green);color:#fff;text-decoration:none;border-radius:14px;
        padding:17px 18px;margin-bottom:12px;text-align:center;transition:transform .12s ease,background .12s ease}
  a.btn:active{transform:scale(.985);background:var(--green-dark)}
  a.btn .t{display:block;font-weight:700;font-size:15px;letter-spacing:2.4px;text-transform:uppercase}
  a.btn .s{display:block;margin-top:5px;font-size:13px;font-weight:300;opacity:.85;letter-spacing:.2px;text-transform:none}
  a.btn.ghost{background:var(--card);color:var(--ink);border:1px solid #dcd6ce}
  a.btn.ghost:active{background:#f2eee9}
  footer{margin-top:auto;padding-top:26px;text-align:center;font-size:12.5px;color:#8d938c;line-height:1.7}
  footer a{color:#8d938c}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="../vitrina/img/logo.png" alt="Romeo Flowers"></header>

  <p class="tag">Букеты и доставка по Костанаю<br>каждый день с 9:00 до 21:00</p>

  <a class="btn" href="../vitrina/" data-go="vitrina">
    <span class="t">Каталог букетов</span>
    <span class="s">Цены и фото, доставка от часа</span>
  </a>

  <a class="btn" href="https://wa.me/77003696666?text=%D0%97%D0%B4%D1%80%D0%B0%D0%B2%D1%81%D1%82%D0%B2%D1%83%D0%B9%D1%82%D0%B5!%20%D0%A5%D0%BE%D1%87%D1%83%20%D0%B7%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D1%82%D1%8C%20%D0%B1%D1%83%D0%BA%D0%B5%D1%82" data-go="whatsapp">
    <span class="t">Заказать в WhatsApp</span>
    <span class="s">Ответим и соберём под ваш повод</span>
  </a>

  <a class="btn" href="../" data-go="anketa">
    <span class="t">Забрать 3000 баллов</span>
    <span class="s">Оставьте важные даты — напомним заранее</span>
  </a>

  <a class="btn ghost" href="https://2gis.kz/kostanay/geo/70000001089278071" data-go="2gis">
    <span class="t">Как нас найти</span>
    <span class="s">Костанай, Алтынсарина 32</span>
  </a>

  <footer>
    Romeo Flowers · Костанай<br>
    <a href="tel:+77003696666">+7 700 369 66 66</a>
  </footer>
</div>

<script>
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbx0FYyE3hckyyyhzZPbf4X2gELlhLoGNj8YbRfJcjj1bTbKlKjo-n16cMUWN7SBnxDepw/exec';
  var src = (new URLSearchParams(location.search).get('utm_source') || 'bio').slice(0, 40);
  var ua = /android|iphone|ipad|mobile/i.test(navigator.userAgent) ? 'mobile' : 'desktop';

  // sendBeacon переживает уход со страницы — иначе клик по кнопке терялся бы у всех,
  // кто уходит мгновенно, а это как раз те, кто нам и нужен. Тот же приём, что на
  // странице отзывов. Content-Type text/plain, чтобы не было preflight к Apps Script.
  function track(event, target) {
    var payload = JSON.stringify({ type: 'hub_event', event: event, target: target || '', src: src, ua: ua });
    try {
      if (navigator.sendBeacon) {
        navigator.sendBeacon(EXEC, new Blob([payload], { type: 'text/plain;charset=UTF-8' }));
        return;
      }
    } catch (e) {}
    try { fetch(EXEC, { method: 'POST', body: payload, headers: { 'Content-Type': 'text/plain' }, keepalive: true }); } catch (e) {}
  }

  track('view');
  document.querySelectorAll('a[data-go]').forEach(function (a) {
    // Ссылку НЕ перехватываем и переход не откладываем: маяк уходит асинхронно,
    // а человек уходит сразу. Задержка ради телеметрии — худшее, что можно сделать.
    a.addEventListener('click', function () { track('click', a.getAttribute('data-go')); });
  });
})();
</script>
</body>
</html>
