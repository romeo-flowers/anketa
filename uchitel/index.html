<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Букеты ко Дню учителя — Romeo Flowers</title>
<meta name="description" content="День учителя, 5 октября. Соберём букет заранее и привезём, куда скажете. Костанай.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Romeo Flowers">
<meta property="og:title" content="Букеты ко Дню учителя">
<meta property="og:description" content="5 октября, понедельник. Соберём заранее и привезём, куда скажете.">
<meta property="og:url" content="https://romeo-flowers.github.io/anketa/uchitel/">
<meta property="og:image" content="https://romeo-flowers.github.io/anketa/uchitel/img/05.jpg">
<meta property="og:locale" content="ru_RU">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../vitrina/img/logo.png">
<link rel="apple-touch-icon" href="../vitrina/img/logo.png">
<style>
  @font-face{font-family:Circe;src:url(../vitrina/fonts/circe-300.woff2) format('woff2');font-weight:300;font-display:swap}
  @font-face{font-family:Circe;src:url(../vitrina/fonts/circe-400.woff2) format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:Circe;src:url(../vitrina/fonts/circe-700.woff2) format('woff2');font-weight:700;font-display:swap}
  /* Фирменный #8ca28c под белым текстом даёт контраст 2,7 — на улице с телефона не читается.
     Для кнопок и шапки тот же тон темнее (4,8). */
  :root{--green:#5f785f;--green-dark:#50684f;--cream:#ece7e1;--card:#faf8f5;--ink:#2f3330}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--cream);color:var(--ink);
       font-family:Circe,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-weight:400}
  .wrap{max-width:460px;margin:0 auto;padding:0 16px 96px}
  header{background:var(--green);margin:0 -16px;padding:28px 20px 24px;text-align:center;color:#fff}
  header img{width:112px;height:auto;display:block;margin:0 auto 16px}
  header h1{margin:0;font-weight:700;font-size:20px;letter-spacing:2px;text-transform:uppercase}
  header p{margin:8px 0 0;font-size:15px;font-weight:300;line-height:1.5}
  .item{background:var(--card);border-radius:16px;overflow:hidden;margin-top:16px;border:1px solid #dcd6ce}
  .item img{display:block;width:100%;height:auto;aspect-ratio:910/1136;background:#e3ddd5}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px}
  .num{font-weight:700;font-size:15px;letter-spacing:1px}
  a.order{background:var(--green);color:#fff;text-decoration:none;border-radius:12px;padding:12px 16px;
          font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
  a.order:active{background:var(--green-dark)}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
       background:rgba(236,231,225,.96);border-top:1px solid #dcd6ce}
  .bar a{display:block;max-width:428px;margin:0 auto;background:var(--green);color:#fff;text-decoration:none;
         border-radius:14px;padding:16px;text-align:center;font-weight:700;font-size:15px;letter-spacing:1.5px;text-transform:uppercase}
  .note{margin:18px 4px 0;font-size:14px;line-height:1.55;color:#4f564f;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="../vitrina/img/logo.png" alt="Romeo Flowers">
    <h1>День учителя</h1>
    <p>Понедельник, 5 октября.<br>Соберём букет заранее и привезём, куда скажете.</p>
  </header>
  <p class="note">Выберите букет и нажмите «Заказать»: откроется WhatsApp с номером букета. На некоторых фото два букета, напишите, какой нравится.</p>
  <div id="list"></div>
</div>
<div class="bar"><a id="wa-main" href="#">Написать в WhatsApp</a></div>

<script>
(function () {
  var PHONE = '77003696666';
  var TOTAL = 20;
  var EXEC = 'https://script.google.com/macros/s/AKfycbx0FYyE3hckyyyhzZPbf4X2gELlhLoGNj8YbRfJcjj1bTbKlKjo-n16cMUWN7SBnxDepw/exec';
  var src = (new URLSearchParams(location.search).get('utm_source') || 'direct').slice(0, 40);
  var ua = /android|iphone|ipad|mobile/i.test(navigator.userAgent) ? 'mobile' : 'desktop';

  // Тот же приём учёта, что на странице-хабе: маяк уходит фоном, переход не ждёт.
  function track(event, target) {
    var payload = JSON.stringify({ type: 'hub_event', event: event, target: target || '', src: src, ua: ua });
    try {
      if (navigator.sendBeacon) { navigator.sendBeacon(EXEC, new Blob([payload], { type: 'text/plain;charset=UTF-8' })); return; }
    } catch (e) {}
    try { fetch(EXEC, { method: 'POST', body: payload, headers: { 'Content-Type': 'text/plain' }, keepalive: true }); } catch (e) {}
  }
  function wa(text) { return 'https://wa.me/' + PHONE + '?text=' + encodeURIComponent(text); }

  var list = document.getElementById('list');
  for (var i = 1; i <= TOTAL; i++) {
    var n = (i < 10 ? '0' : '') + i;
    var div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = '<img loading="' + (i <= 2 ? 'eager' : 'lazy') + '" src="img/' + n + '.jpg" alt="Букет №' + i + '">' +
      '<div class="row"><span class="num">Букет №' + i + '</span>' +
      '<a class="order" data-n="' + i + '" href="' + wa('Здравствуйте! Хочу букет ко Дню учителя, №' + i + ' из каталога') + '">Заказать</a></div>';
    list.appendChild(div);
  }
  [].forEach.call(document.querySelectorAll('a.order'), function (a) {
    a.addEventListener('click', function () { track('click', 'uchitel_' + a.getAttribute('data-n')); });
  });
  var main = document.getElementById('wa-main');
  main.href = wa('Здравствуйте! Хочу букет ко Дню учителя');
  main.addEventListener('click', function () { track('click', 'uchitel_wa'); });
  track('view', 'uchitel');
})();
</script>
</body>
</html>
